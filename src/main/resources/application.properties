spring.application.name=ManageByHR

# MySQL Database Connection
spring.datasource.username=root
spring.datasource.password=Bhoom@25
spring.datasource.url=jdbc:mysql://localhost:3306/hr_emp_management
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============= AGGRESSIVE PORT 9899 HANDLING =============
server.port=9899

# OS-Level Socket Configuration
server.socket.so-reuse-addr=true
server.socket.so-keep-alive=true

# Tomcat Server Configuration
server.shutdown=graceful
server.servlet.context-path=/
server.error.include-message=always
server.compression.enabled=true

# Connection Management
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
server.tomcat.connection-timeout=20000
server.tomcat.socket-options.SO_REUSEADDR=true
server.tomcat.socket-options.SO_KEEPALIVE=true

# Thread Pool Configuration
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# Session Management
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# ============= JPA/Hibernate Configuration =============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.open-in-view=false
# Transaction settings
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=bhoom2525@gmail.com
spring.mail.password=jogv ikos elda slzn
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security debug logging
logging.level.org.springframework.security=WARN
logging.level.root=WARN

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
