spring.application.name=ManageByHR

# MySQL Database Connection
spring.datasource.username=root
spring.datasource.password=Bhoom@25
spring.datasource.url=jdbc:mysql://localhost:3306/hr_emp_management
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============= PERMANENT PORT SOLUTION =============
# Port Configuration: PortBindingConfig will auto-detect and use fallback if needed
# Primary: 9899 | Fallbacks: 9800, 9801, 9802, 9803, 9804
server.port=9899
server.address=0.0.0.0

# OS-Level Socket Configuration - CRITICAL FOR PORT REUSE
# These settings ensure sockets are released quickly and can be reused
server.socket.so-reuse-addr=true
server.socket.so-keep-alive=true

# Tomcat Server Configuration
server.shutdown=graceful
server.servlet.context-path=/
server.error.include-message=always
server.compression.enabled=true

# Tomcat Connection Management - Prevent TIME_WAIT socket exhaustion
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
server.tomcat.connection-timeout=20000

# Tomcat Socket Options - CRITICAL for port cleanup
server.tomcat.socket-options.SO_REUSEADDR=true
server.tomcat.socket-options.SO_KEEPALIVE=true
server.tomcat.socket-options.SO_LINGER=1

# Thread Pool Configuration
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# Session Management
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.tracking-modes=cookie

# ============= SSE (Server-Sent Events) Configuration =============
# Required for real-time notifications
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

# Increase upload/download size limits if needed
server.tomcat.max-http-post-size=2097152

# ============= JPA/Hibernate Configuration =============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.open-in-view=false

# Transaction settings
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

